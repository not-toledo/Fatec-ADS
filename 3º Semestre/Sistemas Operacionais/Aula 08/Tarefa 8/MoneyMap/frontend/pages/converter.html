<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoneyMap — Conversor de moedas</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><i data-lucide="map"></i><span>MoneyMap</span></div>
    <nav class="nav">
      <a href="../index.html"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a href="converter.html" class="active"><i data-lucide="arrow-left-right"></i><span>Conversor</span></a>
      <a href="history.html"><i data-lucide="line-chart"></i><span>Histórico</span></a>
      <a href="comparison.html"><i data-lucide="git-compare"></i><span>Comparador</span></a>
      <a href="indicators.html"><i data-lucide="landmark"></i><span>Indicadores</span></a>
      <a href="favorites.html"><i data-lucide="star"></i><span>Favoritos</span></a>
    </nav>
  </aside>
  <div class="main">
    <main class="content">
      <h1>Conversor de moedas</h1>
      <section class="panel">
        <div class="form-row">
          <div class="field"><label for="amount">Valor</label><input id="amount" type="text" inputmode="decimal" value="1000"></div>
          <div class="field"><label for="from">De</label><select id="from"></select></div>
          <button class="btn" id="swap" aria-label="Inverter moedas"><i data-lucide="arrow-left-right"></i></button>
          <div class="field"><label for="to">Para</label><select id="to"></select></div>
        </div>
        <div class="result" id="result"><small>Digite um valor para converter.</small></div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.446.0/dist/umd/lucide.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/converter.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
